<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Reem+Kufi:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Poppins', system-ui, sans-serif; }
    a { color: #1E6F5C; } a:hover { color: #14503F; }
    .sheet { width: 660px; box-sizing: border-box; background: #F6F4EF; padding: 40px; display: flex; flex-direction: column; gap: 22px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .24em; color: #1E6F5C; }
    .title { font-size: 26px; font-weight: 700; color: #12332B; margin-top: 4px; }
    .card { background: #fff; border: 1px solid #ecece4; border-radius: 22px; box-shadow: 0 10px 28px rgba(18,51,43,.06); }
    .primary { display: flex; align-items: center; gap: 32px; padding: 36px 40px; }
    .wm-ar { font-family: 'Reem Kufi', sans-serif; font-size: 52px; color: #12332B; line-height: 1; }
    .wm-lat { font-family: 'Poppins', sans-serif; font-weight: 700; letter-spacing: .34em; font-size: 15px; color: #1E6F5C; margin-top: 6px; }
    .divider { width: 1px; align-self: stretch; background: #ecece4; }
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .tile { border-radius: 20px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 150px; justify-content: center; }
    .tile .label { font-size: 11px; font-weight: 600; letter-spacing: .04em; }
    .tile.light { background: #fff; border: 1px solid #ecece4; }
    .tile.light .label { color: #8a978f; }
    .tile.dark { background: #12332B; }
    .tile.dark .label { color: #8fb3a8; }
    .tile.teal { background: #1E6F5C; }
    .tile.teal .label { color: #bfe0d6; }
    .iconmask { width: 88px; height: 88px; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
    .palette { display: flex; gap: 12px; padding: 20px 24px; align-items: center; }
    .sw { display: flex; align-items: center; gap: 10px; }
    .dot { width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(0,0,0,.06); }
    .swtxt { font-size: 11px; line-height: 1.3; color: #5b6b64; }
    .swtxt b { color: #12332B; display: block; font-size: 12px; }
  </style>
</helmet>
<div class="sheet">
  <div>
    <div class="eyebrow">MADRASA · BRAND MARK</div>
    <div class="title">Monogram — “M” on a shelf</div>
  </div>

  <!-- Primary lockup -->
  <div class="card primary">
    <svg viewBox="0 0 200 200" width="150" height="150" role="img" aria-label="Madrasa monogram">
      <rect x="14" y="14" width="172" height="172" rx="42" fill="none" stroke="#1E6F5C" stroke-width="8"/>
      <path d="M52 146 L52 66 L100 110 L148 66 L148 146" fill="none" stroke="#1E6F5C" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="52" y="158" width="96" height="9" rx="4.5" fill="#E2A93B"/>
    </svg>
    <div class="divider"></div>
    <div>
      <div class="wm-ar" dir="rtl">مدرسة</div>
      <div class="wm-lat">MADRASA</div>
    </div>
  </div>

  <!-- Variations -->
  <div class="tiles">
    <div class="tile light">
      <div class="iconmask" style="background:#1E6F5C;">
        <svg viewBox="0 0 200 200" width="54" height="54" aria-hidden="true">
          <path d="M52 146 L52 66 L100 110 L148 66 L148 146" fill="none" stroke="#fff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
          <rect x="52" y="160" width="96" height="10" rx="5" fill="#E2A93B"/>
        </svg>
      </div>
      <div class="label">APP ICON</div>
    </div>

    <div class="tile dark">
      <svg viewBox="0 0 200 200" width="72" height="72" aria-hidden="true">
        <rect x="14" y="14" width="172" height="172" rx="42" fill="none" stroke="#fff" stroke-width="8"/>
        <path d="M52 146 L52 66 L100 110 L148 66 L148 146" fill="none" stroke="#fff" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
        <rect x="52" y="158" width="96" height="9" rx="4.5" fill="#E2A93B"/>
      </svg>
      <div class="label">ON DARK / SPLASH</div>
    </div>

    <div class="tile light">
      <svg viewBox="0 0 200 200" width="72" height="72" aria-hidden="true">
        <rect x="14" y="14" width="172" height="172" rx="42" fill="none" stroke="#12332B" stroke-width="8"/>
        <path d="M52 146 L52 66 L100 110 L148 66 L148 146" fill="none" stroke="#12332B" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
        <rect x="52" y="158" width="96" height="9" rx="4.5" fill="#12332B"/>
      </svg>
      <div class="label">MONOCHROME</div>
    </div>
  </div>

  <!-- Palette -->
  <div class="card palette">
    <div class="sw"><div class="dot" style="background:#1E6F5C;"></div><div class="swtxt"><b>Teal</b>#1E6F5C</div></div>
    <div class="sw"><div class="dot" style="background:#E2A93B;"></div><div class="swtxt"><b>Gold</b>#E2A93B</div></div>
    <div class="sw"><div class="dot" style="background:#12332B;"></div><div class="swtxt"><b>Ink</b>#12332B</div></div>
    <div class="sw"><div class="dot" style="background:#F6F4EF;"></div><div class="swtxt"><b>Sand</b>#F6F4EF</div></div>
  </div>
</div>
</x-dc>
</body>
</html>
